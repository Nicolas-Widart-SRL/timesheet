name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: cargo test --locked

  dmg:
    name: Build macOS DMG
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-bundle --version 0.12.0 --locked
      - name: Bundle universal DMG
        run: |
          cargo bundle --release --format dmg --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir dist
          cp target/universal/release/bundle/dmg/Timesheet.dmg "dist/Timesheet-$GITHUB_REF_NAME-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  exe:
    name: Build Windows EXE
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release EXE
        shell: bash
        run: |
          cargo build --locked --release
          mkdir dist
          cp target/release/timesheet.exe "dist/Timesheet-$GITHUB_REF_NAME-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [dmg, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
